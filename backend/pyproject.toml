[project]
name = "fluke-backend"
version = "0.1.0"
description = "API and management services for FLUKE experiments"
readme = "README.md"
requires-python = ">=3.11,<3.12"
dependencies = [
    "alembic>=1.16,<2",
    "argon2-cffi>=25,<26",
    "email-validator>=2,<3",
    "fastapi>=0.115,<1",
    "psycopg[binary]>=3.2,<4",
    "pydantic>=2,<3",
    "pydantic-settings>=2,<3",
    "pyjwt>=2.10,<3",
    "sqlalchemy>=2.0,<2.1",
    "uvicorn>=0.30,<1",
]

[project.scripts]
fluke-admin = "fluke_backend.auth.cli:run"

[dependency-groups]
dev = ["httpx>=0.28,<1", "pytest>=8,<10", "ruff>=0.15,<1"]

[project.optional-dependencies]
# The API install stays lightweight; MVP-02 opts into the pinned training stack.
runner = [
    "fluke-fl",
]

[build-system]
requires = ["uv_build>=0.12.19,<0.13.0"]
build-backend = "uv_build"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--strict-config --strict-markers"
markers = [
    "postgres: tests requiring a disposable local PostgreSQL database",
    "runner: tests requiring the optional FLUKE runner extra",
]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.uv.sources]
fluke-fl = { git = "https://github.com/makgyver/fluke", rev = "37c54630f0b4d9d6164f003cbed0811019acc5e1" }
